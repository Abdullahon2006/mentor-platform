{% extends "base.html" %}

{% block title %}System Error — MentorMatch{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-7 text-center">
        <i class="bi bi-bug text-danger" style="font-size: 3.5rem;"></i>
        <h3 class="mt-3">An unexpected error occurred</h3>
        <p class="text-muted">{{ error }}</p>
        <a href="{{ url_for('profile.home') }}" class="btn btn-outline-primary mt-3">Return to Home</a>
    </div>
</div>
{% endblock %}
