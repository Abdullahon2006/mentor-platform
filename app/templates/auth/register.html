{% extends "base.html" %}

{% block title %}Register Account — MentorMatch{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Join MentorMatch</h3>
                    <p class="text-muted small">Connect, guide, and achieve your technical & career milestones</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label small fw-semibold">First Name *</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required placeholder="John">
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label small fw-semibold">Last Name *</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required placeholder="Doe">
                        </div>

                        <div class="col-md-12">
                            <label for="email" class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="john.doe@itu.edu.tr">
                        </div>

                        <div class="col-md-12">
                            <label for="password" class="form-label small fw-semibold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="At least 6 characters">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label small fw-semibold d-block">I want to register as a: *</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="role" id="role_mentee" value="MENTEE" checked>
                                <label class="form-check-label fw-semibold text-primary" for="role_mentee">
                                    <i class="bi bi-mortarboard"></i> Mentee (Seeking guidance)
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="role" id="role_mentor" value="MENTOR">
                                <label class="form-check-label fw-semibold text-success" for="role_mentor">
                                    <i class="bi bi-briefcase"></i> Mentor (Offering expertise)
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="current_title" class="form-label small fw-semibold">Current Title / Role</label>
                            <input type="text" class="form-control" id="current_title" name="current_title" placeholder="e.g. Student, Software Engineer">
                        </div>
                        <div class="col-md-6">
                            <label for="organization" class="form-label small fw-semibold">School or Organization</label>
                            <input type="text" class="form-control" id="organization" name="organization" placeholder="e.g. Istanbul Technical University">
                        </div>

                        <div class="col-md-12">
                            <label for="bio" class="form-label small fw-semibold">Short Biography</label>
                            <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="Tell others about your background, interests, or goals..."></textarea>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">Create Account</button>
                    </div>
                </form>

                <div class="text-center mt-3 small text-muted">
                    Already registered? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
