{% extends "base.html" %}

{% block title %}Sign In — MentorMatch{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Sign In</h3>
                    <p class="text-muted small">Enter your credentials to access the platform</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="user@domain.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">Sign In</button>
                    </div>
                </form>

                <hr class="my-4">

                <!-- Quick-fill Demo Accounts for BBF 302E Presentation -->
                <div class="bg-light p-3 rounded">
                    <p class="fw-bold small mb-2 text-secondary"><i class="bi bi-lightning-charge-fill text-warning"></i> Demo Accounts (Password: <code>password123</code>):</p>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="fillLogin('dr.demir@techcorp.com', 'password123')">
                            Mentor (Dr. Ahmet Demir)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-info" onclick="fillLogin('ali.yilmaz@itu.edu.tr', 'password123')">
                            Mentee (Ali Yilmaz)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillLogin('admin@itu.edu.tr', 'password123')">
                            Admin Account
                        </button>
                    </div>
                </div>

                <div class="text-center mt-3 small text-muted">
                    Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function fillLogin(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
